	<g id="baner-first-text" opacity="1">
		<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Kantumruy" font-size="100" letter-spacing="0em">
			<tspan x="377" y="212.238">ModuDevCore</tspan>
		</text>
		<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Kantumruy" font-size="25" letter-spacing="0em" mask="url(#typing-mask)">
			<tspan x="377" y="288">&#xab;Modularity without compromise on the core&#xbb;</tspan>
		</text>
		<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Kantumruy" font-size="25" letter-spacing="0em">
			<tspan x="882.408" y="334.435">Github Organization</tspan>
