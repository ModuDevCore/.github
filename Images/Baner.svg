<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
	<style>
		#background {
			fill: black;
		    animation: switch-fill-black-to-white 1s ease 0.5s forwards;
		}

		.icon.show {
		    animation:
		        move-left 1s ease 1.5s both,
		        show-icon 1s ease 0.5s both;
		}

		.icon.hide {
		    animation:
		        move-left 1s ease 1.5s both,
		        hide-icon 1s ease 0.5s both;
		}

		#baner-first-text {
		    animation: show-text 1s ease 2.5s both;
		}

		#typing-reveal {
		    animation: typing 1s steps(1, end) 3.5s both;
		}


		@keyframes typing {
		    0%   { width: 0px; }
		    5%   { width: 25px; }
		    8%   { width: 50px; }
		    12%  { width: 75px; }
		    20%  { width: 100px; }
		    21%  { width: 125px; }
		    25%  { width: 150px; }
		    35%  { width: 190px; }
		    37%  { width: 220px; }
		    42%  { width: 250px; }
		    55%  { width: 300px; }
		    58%  { width: 330px; }
		    70%  { width: 370px; }
		    72%  { width: 400px; }
		    85%  { width: 440px; }
		    100% { width: 478.68px; }
		}

		#background {
		    animation: switch-fill-black-to-white 1s ease forwards;
		    animation-delay: 0.5s;

		    border-radius: 25px;
		}

		@keyframes switch-fill-black-to-white {
			from {
				fill: black;
			}
			to {
				fill: white;
			}
		}

		@keyframes show-text {
		    from {
		        opacity: 0;
		    }
		    to {
		        opacity: 1;
		    }
		}

		@keyframes show-icon {
		    from {
		        opacity: 0;
		    }
		    to {
		        opacity: 1;
		    }
		}

		@keyframes hide-icon {
		    from {
		        opacity: 1;
		    }
		    to {
		        opacity: 0;
		    }
		}

		@keyframes move-left {
		    from {
		        transform: translate(450px, 50px);
		    }
		    to {
		        transform: translate(50px, 50px);
		    }
		}
	</style>
	<defs>
	    <mask id="typing-mask"
	          maskUnits="userSpaceOnUse"
	          maskContentUnits="userSpaceOnUse"
	          x="377" y="240"
	          width="750" height="70">

	        <rect
	            id="typing-reveal"
	            x="377" y="240"
	            width="0" height="70"
	            fill="white"
	        />
	    </mask>
	</defs>
	<rect id="background" width="1200" height="400" rx="50" fill="white" />
	<g class="icon dark-theme show" transform="translate(50px, 50px)" opacity="1" >
